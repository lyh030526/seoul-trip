<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>11.1 나들이 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
</head>
<body>
<style>
/* Layout: one-screen app — header strip, pan/zoom illustrated map, draggable bottom sheet timeline; area popups slide up from the bottom. */
:root {
  --bg: #e6f0f7;
  --paper: #ffffff;
  --land: #eef4e6;
  --seoul: #fde9f0;
  --incheon: #e9ebfb;
  --water: #b9dcf3;
  --water-ink: #4c8fbf;
  --ink: #22303f;
  --muted: #687789;
  --hair: #d5dfe9;
  --accent: #ff6f9c;
  --accent-soft: #ffe1eb;
  --sun: #ffc845;
  --sun-soft: #fff3cf;
  --road: #ffffff;
  --block: #f3f6fa;
  --shadow: 0 6px 22px rgba(40, 70, 110, .14);
  --l1: #0052a4; --l2: #00a84d; --l6: #cd7c2f;
  --park: #d3ecc3; --park-ink: #9fcb8a;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a25; --paper: #1b2533; --land: #18222e; --seoul: #2b2131; --incheon: #21243d;
    --water: #1d3a57; --water-ink: #7fb6df; --ink: #e9eff6; --muted: #9aa9bb; --hair: #2c394a;
    --accent: #ff8db1; --accent-soft: #3a2230; --sun: #ffd166; --sun-soft: #3a3220;
    --road: #2a3646; --block: #222d3b; --park: #1f3427; --park-ink: #2f5039; --shadow: 0 6px 22px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a25; --paper: #1b2533; --land: #18222e; --seoul: #2b2131; --incheon: #21243d;
  --water: #1d3a57; --water-ink: #7fb6df; --ink: #e9eff6; --muted: #9aa9bb; --hair: #2c394a;
  --accent: #ff8db1; --accent-soft: #3a2230; --sun: #ffd166; --sun-soft: #3a3220;
  --road: #2a3646; --block: #222d3b; --park: #1f3427; --park-ink: #2f5039; --shadow: 0 6px 22px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  overflow: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%; max-width: 480px; margin: 0 auto;
  display: flex; flex-direction: column; position: relative;
  background: var(--bg);
}
@media (min-width: 560px) {
  .app { box-shadow: 0 0 0 1px var(--hair), var(--shadow); }
}

/* header */
.top {
  padding-block: 10px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
}
.top .date {
  flex: none; width: 52px; height: 52px; border-radius: 16px;
  background: var(--accent); color: #fff;
  display: grid; place-items: center; text-align: center;
  font-family: var(--font-display); line-height: 1;
  transform: rotate(-4deg);
}
.top .date b { font-size: 22px; font-weight: 400; display: block; }
.top .date small { font-size: 11px; opacity: .9; }
.top h1 { font-family: var(--font-display); font-weight: 400; font-size: 21px; line-height: 1.15; margin: 0; text-wrap: balance; }
.top .route { color: var(--muted); font-size: 13px; }
.status {
  flex: 1 1 100%;
  font-size: 13px; line-height: 1.35; padding: 6px 12px; border-radius: 12px;
  background: var(--sun-soft); color: var(--ink);
}
.status .live { display: inline-block; font-family: var(--font-display); color: var(--accent); margin-right: 6px; }

/* map */
.map-wrap { position: relative; flex: 1 1 auto; min-height: 120px; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: grab; }
#map.dragging { cursor: grabbing; }
.chips {
  position: absolute; top: 8px; left: max(12px, env(safe-area-inset-left, 0px)); right: 60px;
  display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none;
}
.chip {
  pointer-events: auto; border: 0; border-radius: 999px; padding: 5px 11px 5px 6px;
  background: var(--paper); box-shadow: var(--shadow); font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px;
}
.badge {
  display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
  color: #fff; font-family: var(--font-display); font-size: 12px; line-height: 1; flex: none;
}
.b1 { background: var(--l1); } .b2 { background: var(--l2); } .b6 { background: var(--l6); }
.zoom {
  position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 8px;
  display: flex; flex-direction: column; gap: 6px;
}
.zoom button {
  width: 38px; height: 38px; border: 0; border-radius: 12px; background: var(--paper);
  box-shadow: var(--shadow); font-family: var(--font-display); font-size: 20px; line-height: 1;
}

/* svg map styles */
.m-land { fill: var(--land); }
.m-seoul { fill: var(--seoul); stroke: var(--paper); stroke-width: 3; }
.m-incheon { fill: var(--incheon); stroke: var(--paper); stroke-width: 3; }
.m-sea { fill: var(--water); }
.m-river { fill: none; stroke: var(--water); stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
.m-region { font-family: var(--font-display); font-size: 26px; fill: var(--ink); opacity: .16; letter-spacing: 6px; }
.m-water-label { font-family: var(--font-display); font-size: 13px; fill: var(--water-ink); letter-spacing: 3px; }
.m-line-case { fill: none; stroke: var(--paper); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
.m-line { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; opacity: .5; }
.m-progress { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.m-st { fill: var(--paper); stroke-width: 2.5; }
.m-st-label {
  font-family: var(--font-body); font-size: 14px; fill: var(--ink); font-weight: 700;
  paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round;
}
.pin { cursor: pointer; outline: none; }
.pin:focus-visible .cap { stroke-width: 5; }
.pin .cap { fill: var(--paper); stroke: var(--accent); stroke-width: 2.5; filter: drop-shadow(0 3px 4px rgba(40, 70, 110, .25)); }
.pin .tail { fill: var(--accent); }
.pin text { font-family: var(--font-display); font-size: 16px; fill: var(--ink); }
.pin.now .cap { fill: var(--accent); }
.pin.now text { fill: #fff; }
.pin .ring { fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0; }
.pin.now .ring { animation: ring 1.8s ease-out infinite; }
@keyframes ring { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(1.6); } }
.pin .bob { animation: bob 2.6s ease-in-out infinite; transform-box: fill-box; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.train-body { stroke: var(--paper); stroke-width: 2; }
.bubble rect { fill: var(--ink); }
.bubble path { fill: var(--ink); }
.bubble text { fill: var(--paper); font-family: var(--font-display); font-size: 14px; }

/* bottom sheet */
.sheet {
  flex: none; height: var(--sheet-h, 44%);
  background: var(--paper); border-radius: 24px 24px 0 0;
  box-shadow: 0 -6px 24px rgba(40, 70, 110, .12);
  display: flex; flex-direction: column; position: relative; z-index: 2;
  transition: height .28s cubic-bezier(.3, .8, .3, 1);
}
.sheet.dragging { transition: none; }
.handle {
  flex: none; border: 0; background: none; width: 100%;
  padding-block: 10px 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 6px; touch-action: none;
}
.handle .grip { width: 44px; height: 5px; border-radius: 3px; background: var(--hair); }
.handle .hrow { width: 100%; display: flex; justify-content: space-between; align-items: baseline; }
.handle h2 { font-family: var(--font-display); font-weight: 400; font-size: 18px; margin: 0; }
.handle .hint { font-size: 12px; color: var(--muted); }
.list {
  flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
  padding-block: 4px calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 0;
}
.item {
  display: grid; grid-template-columns: 50px 28px minmax(0, 1fr); align-items: start; column-gap: 8px;
  width: 100%; border: 0; background: none; text-align: left; padding: 0;
}
.item .t { font-family: var(--font-display); font-size: 15px; padding-top: 9px; font-variant-numeric: tabular-nums; color: var(--muted); }
.item .rail { position: relative; align-self: stretch; display: flex; justify-content: center; }
.item .rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--hair); }
.item:first-child .rail::before { top: 16px; }
.item:last-child .rail::before { bottom: calc(100% - 16px); }
.item .dot {
  position: relative; margin-top: 6px; width: 26px; height: 26px; border-radius: 50%;
  background: var(--paper); border: 3px solid var(--hair); display: grid; place-items: center; font-size: 13px;
}
.item .card {
  margin-block: 2px 8px; padding: 9px 12px; border-radius: 16px; background: var(--block);
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.item .card b { font-weight: 700; font-size: 15px; line-height: 1.35; }
.item .card span { font-size: 13px; color: var(--muted); }
.item .card .tags { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-top: 3px; }
.item .card .go { font-size: 12px; color: var(--accent); font-family: var(--font-display); margin-left: auto; }
.item.trip .card { background: var(--sun-soft); }
.item.done .card { opacity: .55; }
.item.done .dot { border-color: var(--muted); }
.item.now .dot { border-color: var(--accent); background: var(--accent); }
.item.now .card { box-shadow: inset 0 0 0 2px var(--accent); }
.item.now .t { color: var(--accent); }
.note { font-size: 12px; color: var(--muted); padding: 6px 0 0 86px; }

/* area popup */
.overlay {
  position: fixed; inset: 0; z-index: 20; background: rgba(18, 26, 37, .45);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fade .2s ease;
}
@keyframes fade { from { opacity: 0; } }
.pop {
  width: 100%; max-width: 480px; max-height: 90%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--paper); border-radius: 26px 26px 0 0;
  padding-block: 14px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  animation: up .32s cubic-bezier(.3, .9, .3, 1.05);
}
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.pop-head { display: flex; align-items: center; gap: 10px; }
.pop-head .em { font-size: 28px; }
.pop-head h3 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0; line-height: 1.2; }
.pop-head small { color: var(--muted); font-size: 13px; }
.pop-head .x { margin-left: auto; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--block); font-size: 18px; flex: none; }
.mini { margin-top: 12px; border-radius: 18px; overflow: hidden; background: var(--land); }
.mini svg { display: block; width: 100%; height: auto; }
.mini-cap { font-size: 12px; color: var(--muted); margin-top: 4px; }
.mm-road { fill: none; stroke: var(--road); stroke-width: 12; stroke-linecap: round; }
.mm-water { fill: var(--water); }
.mm-block { fill: var(--block); stroke: var(--hair); stroke-width: 1.5; }
.mm-shrine { fill: var(--sun-soft); stroke: var(--sun); stroke-width: 2; }
.mm-roof { fill: var(--sun); }
.mm-stall { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.mm-under { fill: var(--incheon); stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
.mm-rail { fill: none; stroke: var(--muted); stroke-width: 4; }
.mm-ties { fill: none; stroke: var(--muted); stroke-width: 10; stroke-dasharray: 2 8; }
.mm-route { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 9; animation: march 1s linear infinite; }
@keyframes march { to { stroke-dashoffset: -11; } }
.mm-label { font-family: var(--font-body); font-weight: 700; font-size: 12px; fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-width: 4px; stroke-linejoin: round; }
.mm-small { font-size: 10px; fill: var(--muted); font-weight: 400; }
.mm-water-label { font-family: var(--font-display); font-size: 11px; fill: var(--water-ink); letter-spacing: 2px; }
.mm-stop circle { fill: var(--accent); stroke: var(--paper); stroke-width: 2.5; }
.mm-stop text { fill: #fff; font-family: var(--font-display); font-size: 12px; }
.mm-st circle { stroke: var(--paper); stroke-width: 2.5; }
.mm-st text { fill: #fff; font-family: var(--font-display); font-size: 11px; }
.mm-q { fill: var(--sun); stroke: var(--paper); stroke-width: 2; }
.mm-q-t { font-family: var(--font-display); font-size: 13px; fill: var(--ink); }
.mm-bld { fill: var(--block); stroke: var(--hair); stroke-width: 1; }
.mm-shop { fill: var(--accent-soft); stroke: var(--paper); stroke-width: 1; }
.mm-apt { fill: var(--incheon); stroke: var(--paper); stroke-width: 1; }
.mm-park { fill: var(--park); }
.mm-tree { fill: var(--park-ink); }
.mm-alley { fill: none; stroke: var(--road); stroke-width: 5; stroke-linecap: round; }
.mm-zebra { fill: none; stroke: var(--hair); stroke-width: 6; stroke-dasharray: 2 2; }
.mm-wall { fill: var(--sun-soft); stroke: var(--sun); stroke-width: 2.5; }
.mm-pass { fill: none; stroke: var(--muted); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; opacity: .22; }
.mm-iline { fill: none; stroke: #7ca8d5; stroke-width: 3; stroke-dasharray: 6 5; }
.mm-road-label { font-family: var(--font-body); font-size: 9px; fill: var(--muted); letter-spacing: 2px; text-anchor: middle; }
.mm-area { font-family: var(--font-display); font-size: 15px; fill: var(--ink); opacity: .2; letter-spacing: 3px; }
.mini { cursor: zoom-in; }
.mini.big { overflow-x: auto; cursor: zoom-out; }
.mini.big svg { width: 190%; max-width: none; }

.steps { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.steps li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.steps .n {
  width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff;
  font-family: var(--font-display); display: grid; place-items: center; font-size: 14px; margin-top: 2px;
}
.steps .n.plain { background: var(--hair); color: var(--ink); }
.steps .st-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.steps .st-time { font-family: var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.steps b { font-size: 15px; }
.steps p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.warn { font-size: 11px; background: var(--sun-soft); color: var(--ink); border-radius: 6px; padding: 1px 6px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 9px 13px; border-radius: 14px;
  background: var(--block); color: var(--ink); text-decoration: none; font-size: 14px; border: 0;
}
.btn.primary { background: var(--accent); color: #fff; font-family: var(--font-display); font-size: 15px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="date" aria-label="11월 1일 일요일"><span><b>1</b><small>11월 일</small></span></div>
    <div style="min-width:0">
      <h1>11월 첫날 나들이</h1>
      <div class="route">잠실 → 동묘 → 부평</div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </header>

  <div class="map-wrap" id="mapWrap">
    <svg id="map" role="img" aria-label="서울과 인천 일정 지도" xmlns="http://www.w3.org/2000/svg">
      <g id="layer-base"></g>
      <g id="layer-lines"></g>
      <g id="layer-progress"></g>
      <g id="layer-stations"></g>
      <g id="layer-pins"></g>
      <g id="layer-train"></g>
    </svg>
    <div class="chips">
      <button class="chip" id="playT1" type="button"><span class="badge b2">2</span><span class="badge b6" style="margin-left:-10px">6</span>잠실 → 동묘앞</button>
      <button class="chip" id="playT2" type="button"><span class="badge b1">1</span>동대문 → 부평</button>
    </div>
    <div class="zoom">
      <button type="button" id="zin" aria-label="확대">+</button>
      <button type="button" id="zout" aria-label="축소">−</button>
      <button type="button" id="zfit" aria-label="전체 보기" style="font-size:16px">⤢</button>
    </div>
  </div>

  <section class="sheet" id="sheet">
    <button class="handle" id="handle" type="button" aria-label="일정표 펼치기/접기">
      <span class="grip"></span>
      <span class="hrow"><h2>오늘 일정</h2><span class="hint">카드를 누르면 지도에서 보여줘요</span></span>
    </button>
    <div class="list" id="list"></div>
  </section>
</div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const LINES = { '1': { c: '#0052a4', name: '1호선' }, '2': { c: '#00a84d', name: '2호선' }, '6': { c: '#cd7c2f', name: '6호선' } };
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Stylised projection: west of Guro is squeezed and north–south is stretched so the whole trip fits a phone.
  const P = (lat, lng) => [
    lng < 126.88 ? (lng - 126.66) / 0.22 * 130 : 130 + (lng - 126.88) * 1400,
    (37.6 - lat) * 2600
  ];

  const ST = {
    '부평': [37.4895, 126.7245], '부천': [37.4842, 126.7830], '구로': [37.5030, 126.8819], '신도림': [37.5088, 126.8913],
    '노량진': [37.5140, 126.9425], '용산': [37.5299, 126.9648], '서울역': [37.5547, 126.9707], '시청': [37.5657, 126.9772],
    '종각': [37.5703, 126.9831], '종로3가': [37.5704, 126.9921], '종로5가': [37.5709, 127.0019], '동대문': [37.5714, 127.0098],
    '동묘앞': [37.5733, 127.0165], '신당': [37.5657, 127.0179], '상왕십리': [37.5644, 127.0293], '왕십리': [37.5612, 127.0371],
    '한양대': [37.5554, 127.0436], '뚝섬': [37.5471, 127.0474], '성수': [37.5446, 127.0560], '건대입구': [37.5404, 127.0700],
    '구의': [37.5372, 127.0858], '강변': [37.5352, 127.0946], '잠실나루': [37.5207, 127.1037], '잠실': [37.5133, 127.1001]
  };
  const XY = {};
  for (const k in ST) XY[k] = P(...ST[k]);

  const TRIPS = {
    t1: {
      title: '잠실 → 신당 → 동묘앞', window: ['13:30', '14:05'],
      segs: [
        { line: '2', ids: ['잠실', '잠실나루', '강변', '구의', '건대입구', '성수', '뚝섬', '한양대', '왕십리', '상왕십리', '신당'] },

    list.appendChild(btn);
    return btn;
  });
  const note = document.createElement('div');
  note.className = 'note';
  note.textContent = '지도는 보기 쉽게 비율을 바꿔 그렸어요. 열차 위치는 실제 운행 정보가 아니라 일정 기준 추정이에요.';
  list.appendChild(note);

  /* ---------- live mode (KST, 2026-11-01) ---------- */
  const status = document.getElementById('status');
  function kst() {
    const d = new Date(Date.now() + 9 * 3600e3);
    return { date: d.toISOString().slice(0, 10), m: d.getUTCHours() * 60 + d.getUTCMinutes() + d.getUTCSeconds() / 60 };
  }
  function updateLive() {
    const { date, m } = kst();
    const DAY = '2026-11-01';
    let nowIdx = -1;
    Object.values(pinEls).forEach(p => p.classList.remove('now'));
    if (date === DAY) {
      PLAN.forEach((it, i) => { if (m >= mins(it.s) && m < mins(it.e)) nowIdx = i; });
      itemEls.forEach((b, i) => {
        b.classList.toggle('done', m >= mins(PLAN[i].e));
        b.classList.toggle('now', i === nowIdx);
      });
    } else {
      itemEls.forEach(b => b.classList.remove('done', 'now'));
    }
    const playing = anim && train.getAttribute('visibility') === 'visible' && bubble.getAttribute('visibility') === 'visible';
    const cur = nowIdx >= 0 ? PLAN[nowIdx] : null;
    if (cur && cur.trip) {
      const [a, b] = TRIPS[cur.trip].window.map(mins);
      const r = setProgress(cur.trip, Math.min(1, (m - a) / (b - a)));
      if (!playing) { placeTrain(r.at, r.line); say(''); }
      status.innerHTML = `<span class="live">● 지금</span>${cur.b} · 열차가 지도 위에 있어요`;
    } else {
      if (cur && cur.area) pinEls[cur.area].classList.add('now');
      if (date === DAY) {
        if (m < mins(PLAN[0].s)) status.innerHTML = `오늘이에요! · 11:40 잠실역에서 만나요`;
        else if (cur) status.innerHTML = `<span class="live">● 지금</span>${cur.b}`;
        else status.innerHTML = '오늘 일정 끝! 🏠';
      } else if (date < DAY) {
        const dd = Math.round((Date.parse(DAY) - Date.parse(date)) / 864e5);
        status.innerHTML = `<span class="live">D-${dd}</span> · 11:40 잠실역`;
      } else {
        status.innerHTML = '즐거웠던 나들이 📸';
      }
    }
    return nowIdx;
  }

  /* ---------- area popup ---------- */
  let overlay = null, lastFocus = null;
  const naver = qy => 'https://map.naver.com/p/search/' + encodeURIComponent(qy);
  function openArea(id) {
    closeArea();
    const a = AREAS[id];
    goTo(boxFor(a.view));
    lastFocus = document.activeElement;
    overlay = document.createElement('div');
    overlay.className = 'overlay';
    const stops = a.steps.map((s, i) => s.xy ? `<g class="mm-stop" transform="translate(${s.xy[0]} ${s.xy[1]})"><circle r="10"/><text text-anchor="middle" dy="4">${i + 1}</text></g>` : '').join('');
    const mini = a.mini.replace('</svg>', stops + '</svg>');
    overlay.innerHTML = `<div class="pop" role="dialog" aria-modal="true" aria-labelledby="popTitle" tabindex="-1">
      <div class="pop-head"><span class="em">${a.emoji}</span><div><h3 id="popTitle">${a.name}</h3><small>${a.time}</small></div>
        <button class="x" type="button" aria-label="닫기">✕</button></div>
      <div class="mini">${mini}</div>
      <div class="mini-cap">${a.cap}</div>
      <ol class="steps">${a.steps.map((s, i) => `<li><span class="n${s.xy ? '' : ' plain'}">${i + 1}</span><div>
        <div class="st-head">${s.t ? `<span class="st-time">${s.t}</span>` : ''}<b>${s.b}</b>${s.warn ? `<span class="warn">${s.warn}</span>` : ''}</div>
        <p>${s.p}</p></div></li>`).join('')}</ol>
      <div class="btns">${a.trip ? `<button class="btn primary" type="button" data-trip="${a.trip}">${a.tripLabel}</button>` : ''}
        ${a.links.map(([t, qy]) => `<a class="btn" href="${naver(qy)}" target="_blank" rel="noopener">📍 ${t}</a>`).join('')}</div>
    </div>`;
    overlay.addEventListener('click', e => { if (e.target === overlay) closeArea(); });
    overlay.querySelector('.x').onclick = closeArea;
    const miniBox = overlay.querySelector('.mini');
    miniBox.addEventListener('click', () => { if (!miniBox.dataset.dragged) miniBox.classList.toggle('big'); });
    miniBox.addEventListener('scroll', () => { miniBox.dataset.dragged = '1'; clearTimeout(miniBox._t); miniBox._t = setTimeout(() => { delete miniBox.dataset.dragged; }, 150); });
    const tb = overlay.querySelector('[data-trip]');
    if (tb) tb.onclick = () => playTrip(tb.dataset.trip);
    document.body.appendChild(overlay);
    overlay.querySelector('.pop').focus();
  }
  function closeArea() {
    if (!overlay) return;
    overlay.remove(); overlay = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeArea(); });

  /* ---------- bottom sheet ---------- */
  const sheet = document.getElementById('sheet'), handle = document.getElementById('handle'), app = document.getElementById('app');
  const SNAP = { peek: 74, half: 0.44, full: 0.74 };
  let sheetState = 'half';
  function setSheet(st) {
    sheetState = st;
    const v = SNAP[st];
    sheet.style.setProperty('--sheet-h', typeof v === 'number' && v > 1 ? v + 'px' : v * 100 + '%');
  }
  let drag = null;
  handle.addEventListener('pointerdown', e => { drag = { y: e.clientY, h: sheet.getBoundingClientRect().height, moved: 0 }; sheet.classList.add('dragging'); handle.setPointerCapture(e.pointerId); });
  handle.addEventListener('pointermove', e => {
    if (!drag) return;
    const dy = drag.y - e.clientY; drag.moved = Math.max(drag.moved, Math.abs(dy));
    const H = app.clientHeight;
    const h = Math.max(SNAP.peek, Math.min(H * 0.86, drag.h + dy));
    sheet.style.setProperty('--sheet-h', h + 'px');
  });
  handle.addEventListener('pointerup', () => {
    if (!drag) return;
    sheet.classList.remove('dragging');
    if (drag.moved < 6) { setSheet(sheetState === 'half' ? 'full' : sheetState === 'full' ? 'peek' : 'half'); drag = null; return; }
    const H = app.clientHeight, h = sheet.getBoundingClientRect().height;
    const opts = [['peek', SNAP.peek], ['half', H * SNAP.half], ['full', H * SNAP.full]];
    opts.sort((a, b) => Math.abs(a[1] - h) - Math.abs(b[1] - h));
    setSheet(opts[0][0]);
    drag = null;
  });

  /* ---------- boot ---------- */
  setSheet('half');
  requestAnimationFrame(() => {
    fit(0);
    const idx = updateLive();
    if (idx >= 0) itemEls[idx].scrollIntoView({ block: 'center' });
  });
  setInterval(() => { if (!document.hidden) updateLive(); }, 20000);
})();
</script>

</body>
</html>
